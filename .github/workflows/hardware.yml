name: CPU hardware execution

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable CPU fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.4.4 build==1.6.1 numpy==2.2.6 scikit-learn==1.7.2 pytest==9.2.0
      - run: python scripts/fetch_libsvm.py
      - run: cmake --preset dev -DSTRINGKERNEL_ENABLE_SIMD=OFF
      - run: cmake --build --preset dev --parallel 2
      - run: ctest --preset dev
      - name: Build and install a wheel without ISA-specific sources
        run: |
          python -m build --wheel --outdir build/portable-dist -Ccmake.define.STRINGKERNEL_ENABLE_SIMD=OFF
          python -m pip install --no-deps build/portable-dist/*.whl
      - name: Verify runtime readback and actual portable matrices
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from stringkernels import _native; assert _native.cpu_backend() == 'scalar'"
          python -m pytest "$GITHUB_WORKSPACE/tests/test_python_kernels.py" "$GITHUB_WORKSPACE/tests/test_sklearn.py" "$GITHUB_WORKSPACE/tests/test_package.py" -q

  hardware:
    name: SIMD parity and CPU scaling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7.0.1
        with:
          ref: 6e3990d181e764595adcef69445508d639dee413
          path: build/hardware-baseline-source
      - run: python -m pip install build==1.6.1 numpy==2.2.6 pytest==9.2.0
      - name: Build fixed v1.0.1 and current wheels with the same toolchain
        run: |
          python -m build build/hardware-baseline-source --wheel --outdir build/hardware-baseline-dist
          python -m build --wheel --outdir build/hardware-candidate-dist
          python - <<'PY'
          from pathlib import Path
          import zipfile
          for label in ('baseline', 'candidate'):
              with zipfile.ZipFile(next(Path(f'build/hardware-{label}-dist').glob('*.whl'))) as archive:
                  archive.extractall(f'build/hardware-{label}-package')
          PY
      - run: python -m pytest tests/test_benchmark.py tests/test_hardware_benchmark.py -q
      - name: Compare every matrix cell and record isolated hardware effects
        run: >-
          python benchmarks/benchmark_hardware.py
          --baseline-root build/hardware-baseline-package
          --candidate-root build/hardware-candidate-package
          --cases large_protein_training large_degree_one spectrum_training large_high_similarity
          --affinity-width 2 --trials 3 --seconds 0.2
          --output build/hardware-ci.json
      - name: Enforce the SIMD improvement when this runner supports it
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('hardware', 'benchmarks/benchmark_hardware.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          results = json.loads(Path('build/hardware-ci.json').read_text())
          case = next(c for c in results['cases'] if c['name'] == 'large_degree_one')
          backend = case['results']['auto1']['runs'][0]['reported_cpu_backend']
          flags = set(next(line for line in Path('/proc/cpuinfo').read_text().splitlines()
                           if line.startswith('flags')).split(':', 1)[1].split())
          if {'avx2', 'popcnt'} <= flags:
              assert backend == 'avx2', f'AVX2-capable runner selected {backend}'
          if backend in ('avx2', 'neon'):
              module.check_speedups(results, ['large_degree_one:scalar1/auto1=1.3'])
          else:
              print('Runner has no explicit SIMD backend; complete portable parity remains enforced.')
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: hardware-benchmark-results
          path: build/hardware-ci.json
          if-no-files-found: warn
